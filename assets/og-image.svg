<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowM" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="85%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f0e6"/>
      <stop offset="100%" stop-color="rgba(244,240,230,0.5)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0d"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowM)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>

  <!-- Brand dot + eyebrow -->
  <rect x="70" y="86" width="20" height="20" fill="#ff2d87"/>
  <text x="106" y="103" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500"
        letter-spacing="4" fill="rgba(244,240,230,0.75)" text-transform="uppercase">
    lofy · a dj visualizer for the browser
  </text>

  <!-- Mega wordmark -->
  <text x="70" y="370" font-family="'Bagel Fat One', serif" font-size="320" letter-spacing="-14"
        fill="url(#textGrad)">lofy</text>

  <!-- Sub-headline -->
  <text x="70" y="448" font-family="'Bagel Fat One', serif" font-size="56" letter-spacing="-2" fill="#f4f0e6">
    Music. Color. Live.
  </text>
  <text x="70" y="498" font-family="'JetBrains Mono', monospace" font-size="22" fill="rgba(244,240,230,0.65)">
    Real-time beat-reactive visuals — synced in milliseconds.
  </text>

  <!-- Trust strip -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="3" fill="rgba(244,240,230,0.55)">
    <circle cx="80" cy="555" r="4" fill="#d8ff3a"/>
    <text x="98" y="560">NO INSTALL</text>
    <circle cx="260" cy="555" r="4" fill="#d8ff3a"/>
    <text x="278" y="560">NO LOGIN</text>
    <circle cx="430" cy="555" r="4" fill="#d8ff3a"/>
    <text x="448" y="560">60 FPS</text>
    <circle cx="565" cy="555" r="4" fill="#d8ff3a"/>
    <text x="583" y="560">WEB AUDIO API</text>
    <circle cx="790" cy="555" r="4" fill="#d8ff3a"/>
    <text x="808" y="560">FREE FOREVER</text>
  </g>

  <!-- Faux spectrum bars on the right -->
  <g>
    <rect x="900" y="180" width="22" height="140" fill="#ff2d87"/>
    <rect x="928" y="220" width="22" height="100" fill="#ff2d87"/>
    <rect x="956" y="150" width="22" height="170" fill="#7a3cff"/>
    <rect x="984" y="200" width="22" height="120" fill="#7a3cff"/>
    <rect x="1012" y="100" width="22" height="220" fill="#7a3cff"/>
    <rect x="1040" y="170" width="22" height="150" fill="#00f0ff"/>
    <rect x="1068" y="230" width="22" height="90" fill="#00f0ff"/>
    <rect x="1096" y="180" width="22" height="140" fill="#d8ff3a"/>
    <rect x="1124" y="210" width="22" height="110" fill="#d8ff3a"/>
  </g>

  <!-- Acid LIVE chip -->
  <g transform="translate(900,400)">
    <rect x="0" y="0" width="220" height="64" fill="#d8ff3a" transform="skewX(-6)"/>
    <text x="20" y="46" font-family="'Bagel Fat One', serif" font-size="44" fill="#0a0a0d">LIVE</text>
    <circle cx="170" cy="34" r="7" fill="#0a0a0d"/>
  </g>

  <!-- URL footer -->
  <text x="70" y="600" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3"
        fill="rgba(244,240,230,0.5)">LOFY.APP · v1.1</text>
</svg>

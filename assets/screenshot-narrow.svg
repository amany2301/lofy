<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" width="540" height="720">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="orbA" cx="35%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#ff2d87" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff2d87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="70%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="540" height="720" fill="#0a0a0d"/>
  <rect width="540" height="720" fill="url(#grid)"/>
  <rect width="540" height="720" fill="url(#orbA)"/>
  <rect width="540" height="720" fill="url(#orbB)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="540" height="56" fill="rgba(0,0,0,0.6)"/>
  <rect x="22" y="22" width="12" height="12" fill="#ff2d87"/>
  <text x="42" y="36" font-family="'Bagel Fat One', serif" font-size="20" fill="#f4f0e6">lofy</text>
  <text x="450" y="36" font-family="'JetBrains Mono', monospace" font-size="14" fill="#f4f0e6">128 BPM</text>

  <!-- Particle bursts -->
  <g>
    <circle cx="270" cy="360" r="12" fill="#ff2d87"/>
    <circle cx="200" cy="300" r="8" fill="#7a3cff" opacity="0.8"/>
    <circle cx="340" cy="280" r="9" fill="#00f0ff" opacity="0.85"/>
    <circle cx="170" cy="420" r="7" fill="#d8ff3a" opacity="0.7"/>
    <circle cx="370" cy="420" r="10" fill="#7a3cff" opacity="0.8"/>
    <circle cx="240" cy="220" r="6" fill="#00f0ff" opacity="0.6"/>
    <circle cx="320" cy="500" r="11" fill="#ff2d87" opacity="0.75"/>
    <circle cx="190" cy="240" r="5" fill="#d8ff3a" opacity="0.6"/>
    <circle cx="410" cy="350" r="7" fill="#00f0ff" opacity="0.55"/>
    <circle cx="130" cy="380" r="6" fill="#7a3cff" opacity="0.5"/>
    <circle cx="280" cy="510" r="8" fill="#d8ff3a" opacity="0.7"/>
    <circle cx="240" cy="440" r="5" fill="#ff2d87" opacity="0.55"/>
  </g>

  <text x="270" y="180" text-anchor="middle" font-family="'Bagel Fat One', serif" font-size="36" fill="rgba(244,240,230,0.9)">Particle Storm</text>

  <!-- Mobile control bar -->
  <rect x="16" y="640" width="508" height="64" fill="rgba(10,10,13,0.85)" stroke="rgba(244,240,230,0.14)"/>
  <rect x="36" y="660" width="40" height="24" fill="#d8ff3a"/>
  <text x="46" y="678" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0a0a0d">MIC</text>
  <rect x="82" y="660" width="40" height="24" fill="rgba(0,0,0,0.4)" stroke="rgba(244,240,230,0.18)"/>
  <text x="92" y="678" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(244,240,230,0.7)">FILE</text>
  <rect x="208" y="660" width="74" height="24" fill="#d8ff3a"/>
  <text x="218" y="678" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0a0a0d">PARTICLES</text>
  <rect x="450" y="660" width="58" height="24" fill="rgba(0,0,0,0.5)" stroke="rgba(244,240,230,0.18)"/>
  <text x="464" y="678" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(244,240,230,0.85)">FS · ⛶</text>
</svg>
